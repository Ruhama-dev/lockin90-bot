services:
  - type: worker
    name: lockin90-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: lockin90-db
          property: connectionString
      - key: GROUP_CHAT_ID
        sync: false
      - key: DAILY_LOGS_TOPIC_ID
        sync: false
      - key: GENERAL_TOPIC_ID
        sync: false
      - key: CHALLENGE_START_DATE
        value: "2026-06-29"
      - key: ADMIN_TELEGRAM_ID
        sync: false

databases:
  - name: lockin90-db
    databaseName: lockin90
    user: lockin90_user
    plan: free